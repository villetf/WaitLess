name: Deploy and Restart Test-Service

on:
  push:
    branches:
      - dev  # selected branch

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Publish project
        run: dotnet publish backend/backend.csproj -c Release -o publish

      - name: Move project to target directory
        run: |
          TARGET_DIR="/home/waitless-user/waitless/prod"
          cp -r ./publish/ "$TARGET_DIR"

      - name: Restart waitless-test.service
        run: |
          sudo systemctl restart waitless-test.service
