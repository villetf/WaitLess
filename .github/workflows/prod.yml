name: Deploy and Restart Service

on:
  push:
    branches:
      - main  # selected branch

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Move project to target directory
        run: |
          TARGET_DIR="/home/kejjrod/waitless/prod"
          cp -r ./* "$TARGET_DIR"

      - name: Restart waitless-prod.service
        run: |
          sudo systemctl restart waitless-prod.service
